<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}.ats-prose{font-size:16px}.spec{display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:10px 16px}.spec code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}</style></head><body><div class="ats-prose spec"><code>lead · 40/400</code><p class="lead" style="margin:0">A lead paragraph sets up the slide.</p><code>body · 32/1.75</code><p style="margin:0">Body copy uses <strong>stone-700</strong> for long-form reading, with <a href="#">blue-700 links</a> underlined at 0.1em.</p><code>small · 28</code><p style="margin:0;font-size:.875em;color:var(--myst-color-text-tertiary)">Captions and margin notes.</p></div></body></html>
