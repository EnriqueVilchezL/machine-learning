<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--myst-color-bg)"></i><b>bg</b><code>#ffffff</code></div><div class="sw"><i style="background:var(--myst-color-bg-secondary)"></i><b>bg-secondary</b><code>#f9fafb</code></div><div class="sw"><i style="background:var(--myst-color-surface)"></i><b>surface</b><code>#f3f4f6</code></div><div class="sw"><i style="background:var(--myst-color-border)"></i><b>border</b><code>#e5e7eb</code></div><div class="sw"><i style="background:var(--myst-color-border-strong)"></i><b>border-strong</b><code>#d1d5db</code></div></div><div class="row" style="margin-top:12px"><div class="sw"><i style="background:var(--myst-color-text)"></i><b>text</b><code>#111827</code></div><div class="sw"><i style="background:var(--myst-color-prose-body)"></i><b>prose-body</b><code>#44403c</code></div><div class="sw"><i style="background:var(--myst-color-text-secondary)"></i><b>text-secondary</b><code>#4b5563</code></div><div class="sw"><i style="background:var(--myst-color-text-tertiary)"></i><b>text-tertiary</b><code>#6b7280</code></div><div class="sw"><i style="background:var(--myst-color-code)"></i><b>code</b><code>#be185d</code></div></div></body></html>
