<!-- @dsCard group="Colors" viewport="700x150" name="Admonition colors" subtitle="info · tip/success · warning · danger — border, bg, text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sem div{padding:10px 12px;font-weight:500;font-size:14px;border-radius:var(--radius)}.sem code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--myst-color-text-tertiary);margin-top:4px}</style></head><body><div class="g"><div class="sem"><div style="border-left:4px solid var(--myst-color-info);background:var(--myst-color-info-bg);color:var(--myst-color-info-text)">Note</div><code>#3b82f6 · #eff6ff · #2563eb</code></div><div class="sem"><div style="border-left:4px solid var(--myst-color-tip);background:var(--myst-color-tip-bg);color:var(--myst-color-tip-text)">Tip</div><code>#16a34a · #f0fdf4 · #16a34a</code></div><div class="sem"><div style="border-left:4px solid var(--myst-color-warning);background:var(--myst-color-warning-bg);color:var(--myst-color-warning-text)">Warning</div><code>#d97706 · #fffbeb · #d97706</code></div><div class="sem"><div style="border-left:4px solid var(--myst-color-danger);background:var(--myst-color-danger-bg);color:var(--myst-color-danger-text)">Danger</div><code>#dc2626 · #fef2f2 · #dc2626</code></div></div></body></html>
