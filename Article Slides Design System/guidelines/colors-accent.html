<!-- @dsCard group="Colors" viewport="700x150" name="Accent & links" subtitle="Blue family for links, active, primary" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--myst-color-link)"></i><b>link</b><code>#1d4ed8</code></div><div class="sw"><i style="background:var(--myst-color-link-hover)"></i><b>link-hover / primary</b><code>#3b82f6</code></div><div class="sw"><i style="background:var(--myst-color-link-underline)"></i><b>link-underline</b><code>#60a5fa</code></div><div class="sw"><i style="background:var(--myst-color-active)"></i><b>active</b><code>#2563eb</code></div><div class="sw"><i style="background:var(--myst-color-accent-text)"></i><b>accent-text</b><code>#1e3a8a</code></div></div></body></html>
