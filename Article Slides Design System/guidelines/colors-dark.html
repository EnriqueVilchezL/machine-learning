<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}.dark .sw code{color:#d1d5db}</style></head><body><div class="dark row" style="background:var(--myst-color-bg);padding:14px;border-radius:var(--radius);color:var(--myst-color-text)"><div class="sw"><i style="background:var(--myst-color-bg)"></i><b>bg</b><code>#1c1917</code></div><div class="sw"><i style="background:var(--myst-color-bg-secondary)"></i><b>bg-secondary</b><code>#292524</code></div><div class="sw"><i style="background:var(--myst-color-surface)"></i><b>surface</b><code>#1e293b</code></div><div class="sw"><i style="background:var(--myst-color-prose-body)"></i><b>prose-body</b><code>#d6d3d1</code></div><div class="sw"><i style="background:var(--myst-color-link)"></i><b>link</b><code>#60a5fa</code></div></div></body></html>
