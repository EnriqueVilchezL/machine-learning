<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sem div{padding:10px 12px;font-weight:500;font-size:14px;border-radius:var(--radius)}.sem code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--myst-color-text-tertiary);margin-top:4px}</style></head><body><div class="g"><div class="sem"><div style="border-left:4px solid var(--myst-color-theorem);background:var(--myst-color-theorem-bg);color:var(--myst-color-theorem-text)">Theorem</div><code>#a855f7 · #faf5ff · #9333ea</code></div><div class="sem"><div style="border-left:4px solid var(--myst-color-example);background:var(--myst-color-example-bg);color:var(--myst-color-example-text)">Corollary</div><code>#f97316 · #fff7ed · #ea580c</code></div><div class="sem"><div style="border-left:4px solid var(--myst-color-proof);background:var(--myst-color-proof-bg);color:var(--myst-color-proof-text)">Proof</div><code>#6b7280 · #f9fafb · #4b5563</code></div><div class="sem"><div style="border-left:4px solid var(--myst-color-error);background:var(--myst-color-error-bg);color:var(--myst-color-error-text)">Error state</div><code>#ef4444 · #fee2e2 · #b91c1c</code></div></div></body></html>
