<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & shadow" subtitle="One radius (0.25rem); shadow, shadow-md" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--myst-color-text);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px}.sw i{display:block;height:56px;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgb(0 0 0/.06)}.sw b{display:block;font-size:12px;font-weight:600;margin-top:6px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--myst-color-text-tertiary)}</style></head><body><div class="row" style="gap:28px"><div><div style="width:130px;height:70px;background:#fff;border-radius:var(--radius);border:1px solid var(--myst-color-border)"></div><div style="font-size:11px;margin-top:8px;font-family:var(--font-mono);color:var(--myst-color-text-tertiary)">radius 0.25rem</div></div><div><div style="width:130px;height:70px;background:#fff;box-shadow:var(--shadow)"></div><div style="font-size:11px;margin-top:8px;font-family:var(--font-mono);color:var(--myst-color-text-tertiary)">shadow</div></div><div><div style="width:130px;height:70px;background:#fff;box-shadow:var(--shadow-md);border-radius:var(--radius)"></div><div style="font-size:11px;margin-top:8px;font-family:var(--font-mono);color:var(--myst-color-text-tertiary)">shadow-md</div></div><div><div style="width:130px;height:70px;background:#fff;border-left:4px solid var(--myst-color-info);box-shadow:var(--shadow-md);border-radius:var(--radius)"></div><div style="font-size:11px;margin-top:8px;font-family:var(--font-mono);color:var(--myst-color-text-tertiary)">4px rule</div></div></div></body></html>
